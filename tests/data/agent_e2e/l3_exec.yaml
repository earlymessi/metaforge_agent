    expect_agent: kitting
    expect_status: success
    expect_artifacts_keys: [kitting_report]
    context:
      fixture: bom_jobs
    tags: [kitting, l3, guard]

  - id: L3-KIT-04
    tier: exec
    message: "先排程再预测物料消耗"
    expect_agent: kitting
    expect_status: success
    expect_artifacts_keys: [kitting_report]
    max_ms: 120000
    context:
      fixture: min_jobs
    tags: [kitting, l3]

  - id: L3-KIT-05
