    tier: exec
    message: "交期能不能满足客户"
    expect_agent: commitment
    expect_status: success
    expect_artifacts_keys: [delivery_assessment]
    requires_session_from: L3-SCH-12
    tags: [commitment, l3, multi_turn]

  - id: L3-CMT-02
    tier: exec
    message: "哪些工单可能延期"
    expect_agent: commitment
    expect_status: success
    expect_artifacts_keys: [delivery_assessment]
    requires_session_from: L3-SCH-12
    tags: [commitment, l3, multi_turn]

  - id: L3-CMT-03
    tier: exec
    message: "评估一下当前排程的交付情况"
    expect_agent: commitment
    expect_status: success
    expect_artifacts_keys: [delivery_assessment]
    requires_session_from: L3-SCH-12
    tags: [commitment, l3, multi_turn]

  - id: L3-CMT-04
    tier: exec
    message: "生成一段给客户的交期说明话术"
    expect_agent: commitment
    expect_status: success
    expect_artifacts_keys: [delivery_assessment]
    requires_session_from: L3-SCH-12
    tags: [commitment, l3, multi_turn]

  - id: L3-CMT-05
