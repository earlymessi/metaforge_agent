    expect_status: [success, need_input]
    expect_artifacts_keys: [impact_report]
    context:
      fixture: mes_baseline
    tags: [events, l3]

  - id: L3-EVT-08
    tier: exec
    message: "撤单工单B"
    expect_agent: events
    expect_status: [success, need_input]
    expect_artifacts_keys: [impact_report]
    context:
      fixture: mes_baseline
    tags: [events, l3]

  - id: L3-EVT-09
    tier: exec
    message: "工单A数量改成500件"
    expect_agent: events
    expect_status: [success, need_input]
    expect_artifacts_keys: [impact_report]
    context:
      fixture: mes_baseline
    tags: [events, l3]

  - id: L3-EVT-10
    tier: exec
    message: "客户插单 J005 交期后天"
    expect_agent: events
    expect_status: [success, need_input]
    context:
      fixture: mes_baseline
    tags: [events, l3]

  - id: L3-EVT-11
    tier: exec
    message: "2号产线计划停机2小时"
    expect_agent: events
    expect_status: [success, need_input]
    expect_artifacts_keys: [impact_report]
    context:
      fixture: mes_baseline
    tags: [events, l3]

  - id: L3-EVT-12
    tier: exec
    message: "3号机坏了需要重排"
    expect_agent: events
    expect_status: [success, need_input]
    expect_artifacts_keys: [impact_report]
    context:
      fixture: mes_baseline
    tags: [events, l3, guard]

  - id: L3-EVT-13
    tier: exec
    message: "改交期并重排 订单106 到25"
    expect_agent: events
    expect_status: [success, need_input]
    expect_artifacts_keys: [impact_report]
    context:
      fixture: mes_baseline
    tags: [events, l3, guard]

  - id: L3-EVT-14
    tier: exec
    message: "物料延迟3天到货重排"
    expect_agent: events
    expect_status: [success, need_input]
    expect_artifacts_keys: [impact_report]
    context:
      fixture: mes_baseline
    tags: [events, l3]

  # --- plans (10, 需 Mongo) ---
  - id: L3-PLN-01
    tier: exec
    message: "新建计划试产01"
    expect_agent: plans
    expect_status: success
    tags: [plans, l3, mongo]

  - id: L3-PLN-02
    tier: exec
    message: "列出所有计划"
    expect_agent: plans
    expect_status: success
    tags: [plans, l3, mongo]

  - id: L3-PLN-03
    tier: exec
    message: "查看计划 E2E-试产01"
    expect_agent: plans
    expect_status: [success, need_input]
    tags: [plans, l3, mongo]

  - id: L3-PLN-04
    tier: exec
    message: "加载计划 演示-A"
    expect_agent: plans
    expect_status: [success, need_input]
    tags: [plans, l3, mongo]

  - id: L3-PLN-05
    tier: exec
    message: "把计划 A 改名为计划 B"
    expect_agent: plans
    expect_status: [success, need_input]
    tags: [plans, l3, mongo]

  - id: L3-PLN-06
    tier: exec
    message: "复制计划试产01 为试产02"
    expect_agent: plans
    expect_status: [success, need_input]
    tags: [plans, l3, mongo]

  - id: L3-PLN-07
    tier: exec
    message: "标记计划 A 为已完成"
    expect_agent: plans
    expect_status: [success, need_input]
    tags: [plans, l3, mongo]

  - id: L3-PLN-08
    tier: exec
    message: "删除计划旧版"
    expect_agent: plans
    expect_status: [success, need_input]
    tags: [plans, l3, mongo]

  - id: L3-PLN-09
    tier: exec
    message: "创建一个名为春季批次的计划"
    expect_agent: plans
    expect_status: success
    tags: [plans, l3, mongo]

  - id: L3-PLN-10
    tier: exec
    message: "打开计划 sss"
    expect_agent: plans
    expect_status: [success, need_input]
    tags: [plans, l3, mongo]

  # --- kitting (6) ---
