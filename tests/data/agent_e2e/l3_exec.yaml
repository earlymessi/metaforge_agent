    expect_artifacts_keys: [kitting_report]
    context:
      fixture: min_jobs
    tags: [kitting, l3]

  - id: L3-KIT-06
    tier: exec
    message: "检查一下 BOM 缺料情况"
    expect_agent: kitting
    expect_status: success
    expect_artifacts_keys: [kitting_report]
    context:
      fixture: bom_jobs
    tags: [kitting, l3]

  # --- commitment (6, 依赖排程会话) ---
