# L3 端到端执行用例 — 与 L2 Preview 矩阵 1:1（65 条）
# 运行: RUN_GLM_EXEC=1 python -m metaforge.eval.agent_e2e --tier exec
# 慢用例: AGENT_E2E_SLOW=1  |  plans: AGENT_E2E_MONGO=1

version: 1

cases:
  # --- scheduling (12) ---
  - id: L3-SCH-01
    tier: exec
    message: "用禁忌搜索，交付优先排程"
    expect_agent: scheduling
    expect_status: success
    expect_artifacts_keys: [schedule_results]
    context:
      fixture: min_jobs
    tags: [scheduling, l3]

  - id: L3-SCH-02
    tier: exec
    message: "对比一下遗传算法和模拟退火"
    expect_agent: whatif
    expect_status: success
    expect_artifacts_keys: [what_if]
    context:
      fixture: min_jobs
    tags: [scheduling, l3]

  - id: L3-SCH-03
    tier: exec
    message: "跑一下 ft06 算例，吞吐优先"
    expect_agent: scheduling
    expect_status: success
    expect_artifacts_keys: [schedule_results]
    max_ms: 300000
    context:
      fixture: min_jobs
    tags: [scheduling, l3, slow]

  - id: L3-SCH-04
    tier: exec
    message: "快速先出个结果"
    expect_agent: scheduling
    expect_status: success
    expect_artifacts_keys: [schedule_results]
    context:
      fixture: min_jobs
    tags: [scheduling, l3]

  - id: L3-SCH-05
    tier: exec
    message: "帮我排一下"
    expect_agent: scheduling
    expect_status: [success, need_input, pending_clarification]
    context:
      fixture: min_jobs
    tags: [scheduling, l3]

  - id: L3-SCH-06
    tier: exec
    message: "按交期优先，全量对比所有算法"
    expect_agent: scheduling
    expect_status: success
    expect_artifacts_keys: [schedule_results]
    max_ms: 300000
    context:
      fixture: min_jobs
    tags: [scheduling, l3, slow]

  - id: L3-SCH-07
    tier: exec
    message: "用 SPT 排程，不考虑物料"
    expect_agent: scheduling
    expect_status: success
    expect_artifacts_keys: [schedule_results]
    context:
      fixture: min_jobs
    tags: [scheduling, l3]

  - id: L3-SCH-08
    tier: exec
    message: "有哪些算法可以用？"
    expect_agent: scheduling
    expect_status: success
    context:
      fixture: min_jobs
    tags: [scheduling, l3]

  - id: L3-SCH-09
    tier: exec
    message: "把这个计划排程并保存落库"
    expect_agent: scheduling
    expect_status: [success, pending_confirm, need_input]
    context:
      fixture: min_jobs
      e2e_plan_name: E2E-Persist-Base
    tags: [scheduling, l3, persist, mongo]

  - id: L3-SCH-10
    tier: exec
    message: "给当前工单做交付优先排程"
    expect_agent: scheduling
    expect_status: success
    expect_artifacts_keys: [schedule_results]
    context:
      fixture: min_jobs
    tags: [scheduling, l3]

  - id: L3-SCH-11
    tier: exec
    message: "用禁忌搜索和 SPT 对比一下"
    expect_agent: whatif
    expect_status: success
    expect_artifacts_keys: [what_if]
    max_ms: 120000
    context:
      fixture: min_jobs
    tags: [scheduling, l3]

  - id: L3-SCH-12
    tier: exec
    message: "排程"
    intent: schedule
    params:
      skip_parse: true
      solvers: [spt, ts]
    expect_agent: scheduling
    expect_status: success
    expect_artifacts_keys: [schedule_results]
    context:
      fixture: min_jobs
    tags: [scheduling, l3, deterministic]

  # --- events (14) ---
  - id: L3-EVT-01
    tier: exec
    message: "3号机坏了4小时"
    expect_agent: events
    expect_status: [success, need_input]
    expect_artifacts_keys: [impact_report]
    context:
      fixture: mes_baseline
    tags: [events, l3]

  - id: L3-EVT-02
    tier: exec
    message: "紧急插单"
    expect_agent: events
    expect_status: [success, need_input]
    context:
